modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/LIUKRAST/Deployer/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://liukrast.net/"
logoFile="${mod_id}.png"
credits='''${mod_credits}\n${mod_translations}'''
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="compat_manager"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="create_factory_logistics"
    type="optional"
    versionRange="[1.6.1,)"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="fluidlogistics"
    type="incompatible"
    versionRange="(,1.3.3)"
    reason="Create: FluidLogistics versions before 1.3.3 break the Re-Packager when used with Deployer. Please update Create: FluidLogistics to 1.3.3 or newer."
